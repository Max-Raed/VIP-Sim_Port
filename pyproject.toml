[build-system]
# 1.27 is the first hatchling with PEP 639 (license expression + license-files).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vipsim"
dynamic = ["version"]
description = "Visual-impairment simulation filters: a NumPy/PyTorch port of the VIP-Sim Unity shaders"
readme = "readme.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Max Rädler" },
    { name = "Omid Rajabi" },
    { name = "Mark Colley" },
]
keywords = ["visual impairment", "low vision", "accessibility", "simulation", "image filters", "VIP-Sim"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=2.3",
    "pillow>=12.0",
]

[project.optional-dependencies]
# apply_teichopsia needs scikit-image (HSV conversion, polygon raster).
teichopsia = ["scikit-image>=0.24"]
gpu = ["torch>=2.11"]
gym = ["vipsim[gpu]", "gymnasium>=1.0.0"]
all = ["vipsim[teichopsia,gpu,gym]"]

[project.scripts]
vipsim = "vipsim.filters:main"

[project.urls]
Homepage = "https://github.com/Max-Raed/VIP-Sim_Port"
Upstream = "https://github.com/Max-Raed/VIP-Sim"
Issues = "https://github.com/Max-Raed/VIP-Sim_Port/issues"

[tool.hatch.version]
# Single source of truth: __version__ in vipsim/__init__.py (currently 0.1.0).
path = "vipsim/__init__.py"

[tool.hatch.build.targets.wheel]
# Only the package; vipsim/assets/ (the field-loss overlay) ships inside it.
packages = ["vipsim"]

[tool.hatch.build.targets.sdist]
# No tests, validation scripts, Unity captures, renders or abs_diff_out.
only-include = ["vipsim", "readme.md", "LICENSE"]
